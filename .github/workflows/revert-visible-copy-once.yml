name: Restore pre-today visible copy only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/revert-visible-copy-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Restore visible website copy without reverting technical changes
        shell: python
        run: |
          from pathlib import Path

          store = Path('store-v3/index.html')
          s = store.read_text(encoding='utf-8')
          replacements = {
            '<p class="book-hook">See the output. Infer the structure. Test the model.</p>': '<p class="book-hook">Structures from coding and engineering can expose hidden causes, missing variables</p>',
            '<p class="book-value">160 pages · 51 structures · 52 source records · 20-page workbook · AI reasoning framework</p>': '<p class="book-value">160-page study book · 51 structures · 6 case studies · 5 free AI frameworks</p>',
            '<span class="purchase-word">BUY BOOK <b aria-hidden="true">↗</b></span>\n          </a>\n        </div>\n      </article>\n    </section>': '<span class="purchase-word">VIEW BOOK <b aria-hidden="true">↗</b></span>\n          </a>\n        </div>\n      </article>\n    </section>'
          }
          missing = [old for old in replacements if old not in s]
          if missing:
            raise SystemExit('Expected current bookstore strings not found: ' + repr(missing))
          for old, new in replacements.items():
            s = s.replace(old, new, 1)
          store.write_text(s, encoding='utf-8')

          page = Path('index.html')
          s = page.read_text(encoding='utf-8')
          nav = '        <a href="/ai-human-behavior">AI / HCI</a>\n'
          current_footer = '<span class="footer-links"><a href="/methodology">METHOD &amp; SOURCES</a><i aria-hidden="true">|</i><a href="/ai-human-behavior">AI / HCI RESEARCH</a><i aria-hidden="true">|</i><a href="https://reasoning-library.vercel.app/">ALL BOOKS</a></span>'
          old_footer = '<span class="footer-links"><a href="/methodology">METHOD &amp; SOURCES</a><i aria-hidden="true">|</i><a href="https://reasoning-library.vercel.app/">ALL BOOKS</a></span>'
          if nav not in s or current_footer not in s:
            raise SystemExit('Expected current Manipulation navigation strings not found')
          s = s.replace(nav, '', 1)
          s = s.replace(current_footer, old_footer, 1)
          page.write_text(s, encoding='utf-8')
      - name: Commit restored visible copy and remove one-time workflow
        run: |
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/revert-visible-copy-once.yml
          git add index.html store-v3/index.html
          git commit -m "Restore pre-today visible website copy only"
          git push
