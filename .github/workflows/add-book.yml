name: Propose book from landing page

on:
  workflow_dispatch:
    inputs:
      url:
        description: Landing page URL for the new book
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read landing page and create review draft
        run: node tools/add-book.mjs "${{ inputs.url }}"

      - name: Open review branch
        env:
          GH_TOKEN: ${{ github.token }}
          BOOK_URL: ${{ inputs.url }}
        run: |
          BRANCH="book-intake-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add store/data/inbox
          git commit -m "Propose book from landing page"
          git push origin "$BRANCH"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "Review new book proposal" \
            --body "Source landing page: $BOOK_URL\n\nThis PR contains proposal data only. Review every extracted field before moving any approved data into store/data/books.json."
