name: A3 canonical author alignment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a3-canonical-author-once.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align public author entities to canonical Person
        shell: python
        run: |
          from pathlib import Path

          person_id = "https://joe-nasr-signals.vercel.app/v2/#joe-nasr"
          person_url = "https://joe-nasr-signals.vercel.app/v2/"

          p = Path("index.html")
          s = p.read_text()
          local_id = "https://manipulation-the-fool-and-the-wise-two.vercel.app/#author"
          s = s.replace(local_id, person_id)
          old = '{"@type":"Person","@id":"' + person_id + '","name":"Joseph Nasr","alternateName":["J. Nasr","Joe Nasr"],"sameAs":["https://linktr.ee/joenasr"]}'
          new = '{"@type":"Person","@id":"' + person_id + '","name":"Joe Nasr","alternateName":["J. Nasr","Joe Ribal Nasr","Joseph Ribal Nasr"],"url":"' + person_url + '","sameAs":["https://linktr.ee/joenasr","https://github.com/Joenasriani"]}'
          if old not in s:
              raise SystemExit("Manipulation Person object not found after ID normalization")
          p.write_text(s.replace(old, new))

          p = Path("store-v3/index.html")
          s = p.read_text()
          local_id = "https://reasoning-library.vercel.app/#author"
          s = s.replace(local_id, person_id)
          old = '        "@type": "Person",\n        "@id": "' + person_id + '",\n        "name": "Joseph Nasr",\n        "alternateName": ["J. Nasr", "Joe Nasr"],\n        "url": "https://reasoning-library.vercel.app/",\n        "sameAs": ["https://linktr.ee/joenasr"]'
          new = '        "@type": "Person",\n        "@id": "' + person_id + '",\n        "name": "Joe Nasr",\n        "alternateName": ["J. Nasr", "Joe Ribal Nasr", "Joseph Ribal Nasr"],\n        "url": "' + person_url + '",\n        "sameAs": ["https://linktr.ee/joenasr", "https://github.com/Joenasriani"]'
          if old not in s:
              raise SystemExit("Store Person object not found after ID normalization")
          p.write_text(s.replace(old, new))

      - name: Remove one-time workflow
        run: rm .github/workflows/a3-canonical-author-once.yml
      - name: Commit A3 alignment
        run: |
          git config user.name "Joe Nasr repository maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add index.html store-v3/index.html .github/workflows/a3-canonical-author-once.yml
          git commit -m "Align book and store author entities with canonical Joe Nasr identity"
          git push
