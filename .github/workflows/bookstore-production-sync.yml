name: Bookstore production sync

on:
  workflow_dispatch:

concurrency:
  group: bookstore-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_aK7orsaNw316c1bdLjjKFVMy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not configured in this repository or organization. Add it before running production sync."
            exit 2
          fi

      - name: Checkout Reasoning Library and Manipulation
        uses: actions/checkout@v4
        with:
          path: test-things

      - name: Checkout Structure of Life
        uses: actions/checkout@v4
        with:
          repository: Joenasriani/structure-of-life-book
          path: structure-of-life

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Reasoning Library
        working-directory: test-things/store-v3
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_wOatJv2jARExk7008J15Jv7HbcNn
        run: vercel deploy --prod --yes --force --token="$VERCEL_TOKEN"

      - name: Deploy Manipulation
        working-directory: test-things
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_LM2IRHgaBTjJ397TBzNux308FuEw
        run: vercel deploy --prod --yes --force --token="$VERCEL_TOKEN"

      - name: Deploy Structure of Life
        working-directory: structure-of-life
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_tnA6mm9ivIayBSUAfLRxIiTxtYzb
        run: vercel deploy --prod --yes --force --token="$VERCEL_TOKEN"

      - name: Verify deployed pages, checkout mappings and cover
        working-directory: test-things
        run: node scripts/verify-production.mjs
