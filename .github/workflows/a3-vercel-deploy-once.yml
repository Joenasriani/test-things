name: A3 Vercel production propagation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/a3-vercel-deploy-once.yml

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_aK7orsaNw316c1bdLjjKFVMy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment credential
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN repository or organization secret is not configured."
            exit 2
          fi

      - name: Checkout Manipulation and Reasoning Library source
        uses: actions/checkout@v4
        with:
          path: test-things

      - name: Checkout Structure of Life source
        uses: actions/checkout@v4
        with:
          repository: Joenasriani/structure-of-life-book
          path: structure-of-life

      - name: Checkout Visual Framework source
        uses: actions/checkout@v4
        with:
          repository: Joenasriani/visual-framework-system-app
          path: visual-framework

      - name: Checkout Apex Innovate source
        uses: actions/checkout@v4
        with:
          repository: Joenasriani/apex-innovate
          path: apex-innovate

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Reasoning Library
        working-directory: test-things/store-v3
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_wOatJv2jARExk7008J15Jv7HbcNn
        run: vercel deploy --prod --yes --force --token="$VERCEL_TOKEN"

      - name: Deploy Manipulation
        working-directory: test-things
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_enAbuUeWubH2zaeKIcb8komOlIZZ
        run: vercel deploy --prod --yes --force --token="$VERCEL_TOKEN"

      - name: Deploy Structure of Life
        working-directory: structure-of-life
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_tnA6mm9ivIayBSUAfLRxIiTxtYzb
        run: vercel deploy --prod --yes --force --token="$VERCEL_TOKEN"

      - name: Deploy Visual Framework
        working-directory: visual-framework
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_f7pMyrPPQTgHVB9xlF4CApOTVGpy
        run: vercel deploy --prod --yes --force --token="$VERCEL_TOKEN"

      - name: Deploy Apex Innovate
        working-directory: apex-innovate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_orU3BILg3A4TqZgK4ePPzHmcOnYs
        run: vercel deploy --prod --yes --force --token="$VERCEL_TOKEN"
